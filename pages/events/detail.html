    <header>
        <div class="header-container">
            <a href="../../main/index.html" class="logo">8BIT LORE</a>
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Buscar...">

                <a href="../../about.html" class="nav-box">ACERCA DE</a>
            </nav>
        </div>
    </header>

    <main class="event-detail-main">
        <!-- Event Hero Section -->
        <section class="event-hero">
            <div class="event-hero-content">
                <div class="event-logo-container" id="event-logo-container">
                    <!-- Event logo will be loaded here -->
                </div>
                <div class="event-hero-info">
                    <h1 id="event-name" class="event-title">Cargando...</h1>
                    <div class="event-dates">
                        <div class="date-item">
                            <span class="date-label">Inicio:</span>
                            <span id="event-start-date" class="date-value">-</span>
                        </div>
                        <div class="date-item">
                            <span class="date-label">Fin:</span>
                            <span id="event-end-date" class="date-value">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Countdown Section (Only for upcoming events) -->
        <section class="event-countdown-section" id="countdown-section" style="display: none;">
            <h2>⏱️ El evento comienza en:</h2>
            <div id="event-countdown" class="countdown-display"></div>
        </section>

        <!-- Description Section -->
        <section class="event-description-section">
            <h2>Descripción del Evento</h2>
            <p id="event-description">Cargando descripción...</p>
        </section>

        <!-- Videos Section -->
        <section class="event-videos-section" id="videos-section" style="display: none;">
            <h2>Videos</h2>
            <div id="event-videos" class="videos-container"></div>
        </section>

        <!-- Links Section -->
        <section class="event-links-section" id="links-section" style="display: none;">
            <h2>Enlaces</h2>
            <div id="event-links" class="links-container"></div>
        </section>

        <!-- Associated Games Section -->
        <section class="event-games-section" id="games-section" style="display: none;">
            <h2>Juegos Asociados</h2>
            <div id="event-games" class="event-games-grid"></div>
        </section>
    </main>
